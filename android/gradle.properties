# 本机 16GB 内存：Gradle 堆过大 + parallel 易触发 OOM（见 hs_err_pid*.log）
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Windows：项目在 D:、Pub 缓存在 C: 时，Kotlin 增量编译会报 different roots
kotlin.incremental=false
kotlin.incremental.android=false
