# App Store / TestFlight：云端 Mac 打包并上传，Windows 本地无需 Mac。
# 在 GitHub → Actions →「iOS App Store Upload」→ Run workflow 手动触发。
#
# ── GitHub Secrets（Repository secrets）────────────────────────────────
# IOS_DISTRIBUTION_CERTIFICATE_BASE64   Distribution .p12 的 base64
# IOS_DISTRIBUTION_CERTIFICATE_PASSWORD .p12 密码
# IOS_PROVISIONING_PROFILE_BASE64       App Store 描述文件 .mobileprovision 的 base64
# IOS_KEYCHAIN_PASSWORD                 临时钥匙串密码（任意强随机字符串）
# IOS_DEVELOPMENT_TEAM                  Apple Team ID（默认 U8443M3MV7）
# APPSTORE_ISSUER_ID                    App Store Connect API Issuer ID
# APPSTORE_KEY_ID                       API 密钥 Key ID
# APPSTORE_PRIVATE_KEY                  API 密钥 .p8 全文（含 BEGIN/END 行）

name: iOS App Store Upload

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API_BASE（--dart-define）'
        required: false
        default: 'http://115.159.46.108:8100'
      build_number:
        description: '可选：覆盖 iOS 构建号（CFBundleVersion）'
        required: false
        default: ''
  workflow_call:
    inputs:
      api_base:
        description: API_BASE for Flutter build
        type: string
        required: false
        default: 'http://115.159.46.108:8100'
      build_number:
        description: Override CFBundleVersion build number
        type: string
        required: false
        default: ''

jobs:
  build-and-upload:
    # App Store 自 2026 起要求 iOS 26 SDK（Xcode 26+）；macos-latest 可能仍为 Xcode 16.4。
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUNDLE_ID: com.mirror.mirrorMobile
      API_BASE: ${{ inputs.api_base || github.event.inputs.api_base || vars.API_BASE || 'http://115.159.46.108:8100' }}
      BUILD_NUMBER: ${{ inputs.build_number || github.event.inputs.build_number || '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          else
            ls /Applications | grep -i Xcode
            echo "::error::No Xcode 26 found on runner"
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Force iOS Deployment Target 15.0
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '15.0'/g" ios/Podfile
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET'\] = '.*'/IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'/g" ios/Podfile
          fi
          if [ -f "ios/Flutter/AppFrameworkInfo.plist" ]; then
            sed -i '' 's/<string>1[0-4]\.0<\/string>/<string>15.0<\/string>/g' ios/Flutter/AppFrameworkInfo.plist
            sed -i '' 's/<string>9\.0<\/string>/<string>15.0<\/string>/g' ios/Flutter/AppFrameworkInfo.plist
          fi

      - name: Install CocoaPods dependencies
        run: |
          flutter build ios --config-only --release
          cd ios
          pod install --repo-update

      - name: Install Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install App Store provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PP_PATH=$RUNNER_TEMP/build_pp_appstore.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          PP_XML="$(security cms -D -i "$PP_PATH")"
          PP_PLIST="$RUNNER_TEMP/profile.plist"
          printf '%s' "$PP_XML" > "$PP_PLIST"

          PP_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PP_PLIST")"
          PP_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PP_PLIST")"

          TEAM_ID=""
          for key in 'TeamIdentifier:0' 'TeamIdentifier.0' 'Entitlements:com.apple.developer.team-identifier'; do
            TEAM_ID="$(/usr/libexec/PlistBuddy -c "Print ${key}" "$PP_PLIST" 2>/dev/null || true)"
            if [ -n "$TEAM_ID" ]; then
              break
            fi
          done
          if [ -z "$TEAM_ID" ]; then
            APP_ID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PP_PLIST" 2>/dev/null || true)"
            if [ -n "$APP_ID" ] && [[ "$APP_ID" == *.* ]]; then
              TEAM_ID="${APP_ID%%.*}"
            fi
          fi
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="${{ secrets.IOS_DEVELOPMENT_TEAM }}"
          fi
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="U8443M3MV7"
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.mobileprovision"

          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "PP_NAME=$PP_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "Installed App Store profile: $PP_NAME ($PP_UUID), team: $TEAM_ID"

      - name: Apply provisioning profile UUID to Xcode project
        run: |
          set -euo pipefail
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i.bak "s/REPLACE_ME_PROVISIONING_UUID/${PP_UUID}/g" "$PBXPROJ"
          sed -i.bak '/PROVISIONING_PROFILE_SPECIFIER = /d' "$PBXPROJ"
          rm -f "${PBXPROJ}.bak"
          grep "PROVISIONING_PROFILE = ${PP_UUID}" "$PBXPROJ"

      - name: Create ExportOptions.appstore.plist
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.appstore.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PP_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          echo "ExportOptions profile: ${PP_NAME} (${PP_UUID})"

      - name: Build App Store IPA
        run: |
          args=(build ipa --release --export-options-plist=ios/ExportOptions.appstore.plist)
          args+=(--dart-define=API_BASE="$API_BASE")
          args+=(--dart-define=HIDE_BILLING=true)
          if [ -n "$BUILD_NUMBER" ]; then
            args+=(--build-number="$BUILD_NUMBER")
          fi
          flutter "${args[@]}"

      - name: Resolve IPA path
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found under build/ios/ipa"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          ls -lh "$IPA_PATH"

      - name: Verify IPA bundle id
        run: |
          tmpdir="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$tmpdir"
          app_plist="$(find "$tmpdir/Payload" -maxdepth 2 -name Info.plist | head -1)"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")"
          echo "Bundle ID : $bundle_id"
          echo "Version   : $version ($build)"
          test "$bundle_id" = "$BUNDLE_ID"
          rm -rf "$tmpdir"

      - name: Upload to TestFlight (App Store Connect)
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Upload result hint
        if: success()
        run: |
          echo "If TestFlight is still empty after 30 minutes, check:"
          echo "  1. App Store Connect home → pending agreements (yellow banner)"
          echo "  2. https://appstoreconnect.apple.com/activity"
          echo "  3. Apple Developer account email for Invalid Binary notices"

      - name: Upload IPA artifact (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: MirrorAppStoreIpa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
